server {
    listen 80;
    server_name buscapeli.duckdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://buscapeli.duckdns.org$request_uri;
    }
}

server {
    listen 80 default_server;
    server_name _;
    return 308 https://buscapeli.duckdns.org$request_uri;
}

server {
    listen 443 ssl;
    server_name buscapeli.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/buscapeli.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buscapeli.duckdns.org/privkey.pem;
    ssl_session_cache shared:buscapeli_tls:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
